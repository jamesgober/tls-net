name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  # Every feature except `fips`, which needs CMake and Go and has its own job
  # (decision D-042).
  FULL: aws-lc,ring,prebuilt-nasm,webpki-roots,platform-verifier,key-vault,net-io,ja3-md5,rustls-escape-hatch,dangerous-keylog
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features but fips)
        run: cargo clippy --all-targets --features ${{ env.FULL }} -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (ring provider only)
        run: cargo clippy --all-targets --no-default-features --features ring,webpki-roots -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features but fips)
        run: cargo test --features ${{ env.FULL }}
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Platform verifier against public sites
        if: matrix.rust == 'stable'
        run: cargo test --features platform-verifier --test network test_platform_verifier
        env:
          TLS_NET_NETWORK: "1"
      - name: Build examples
        run: cargo build --examples
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features but fips)
        run: cargo doc --no-deps --features ${{ env.FULL }}
        env:
          RUSTDOCFLAGS: "-D warnings"

  net-io-range:
    # tls-net accepts net-io >= 0.4, < 0.8 (decisions D-036, D-121): build against
    # the lowest release of the range as well as the newest.
    name: net-io lowest supported release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Pin net-io 0.4.0
        run: |
          cargo generate-lockfile
          cargo update -p net-io --precise 0.4.0
      - name: Check with net-io 0.4.0
        run: cargo check --all-targets --features net-io

  interop:
    # Opt-in tests against other TLS stacks and public sites (decision D-058).
    name: Interop (OpenSSL, curl, Go, public sites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tool versions
        run: |
          openssl version
          curl --version | head -n 1
          go version
      - name: Interop and network tests
        run: cargo test --test interop --test network --test go --test consumers
        env:
          TLS_NET_INTEROP: "1"
          TLS_NET_NETWORK: "1"
          TLS_NET_GO: "1"
      - name: Pin comparison timing (T-21)
        run: cargo test --release --lib test_t21
        env:
          TLS_NET_TIMING: "1"
      - name: Unknown-name refusal timing (T-25)
        run: cargo test --release --test attacks test_t25
        env:
          TLS_NET_TIMING: "1"

  mta:
    # The STARTTLS shape against a real MTA (D-119): Postfix on loopback
    # with the test certificate, smtp-net's dialogue through tls-net.
    name: STARTTLS against Postfix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Postfix with the test certificate
        run: |
          echo "postfix postfix/main_mailer_type select Local only" | sudo debconf-set-selections
          echo "postfix postfix/mailname string localhost" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix
          sudo install -m 644 tests/data/site.pem /etc/postfix/tls-net.pem
          sudo install -m 600 tests/data/site.key /etc/postfix/tls-net.key
          sudo postconf -e             "smtpd_tls_cert_file=/etc/postfix/tls-net.pem"             "smtpd_tls_key_file=/etc/postfix/tls-net.key"             "smtpd_tls_security_level=may"             "inet_interfaces=loopback-only"
          sudo systemctl restart postfix
          postconf -d mail_version
      - name: STARTTLS tests
        run: cargo test --test consumers starttls
        env:
          TLS_NET_MTA: "127.0.0.1:25"

  fips:
    # FIPS 140-3 build over aws-lc-rs: needs CMake and Go (on the runner).
    name: FIPS (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tool versions
        run: |
          cmake --version | head -n 1
          go version
      - name: Test with fips
        run: cargo test --features fips

  loom:
    # Model checks of the snapshot, the capacity gate, and the ticket ring (D-080).
    name: loom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Model checks
        run: cargo test --release --lib loom
        env:
          RUSTFLAGS: "--cfg tls_net_loom"

  miri:
    # Undefined-behaviour checks of the library code that runs without a
    # crypto provider (parsers, SNI, tickets, snapshot), D-112. The providers
    # are C and assembly, which Miri cannot run.
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: cargo miri test --lib --no-default-features
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build every fuzz target
        # The prebuilt cargo-fuzz targets musl by default; fuzz on glibc.
        working-directory: fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  perf-harness:
    # The unpublished end-to-end comparison (perf/, decision D-099) must keep
    # building; it is run by hand (docs/PERFORMANCE.md).
    name: Perf harness builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf
      - name: Check
        run: cargo check --manifest-path perf/Cargo.toml
      - name: Benches compile (with the bench cfg)
        run: cargo check --benches --features rustls-escape-hatch
        env:
          RUSTFLAGS: "--cfg tls_net_bench"

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny (all features but fips)
        run: cargo deny --features ${{ env.FULL }} check
      - name: Deny (with fips, D-094)
        run: cargo deny --all-features check
