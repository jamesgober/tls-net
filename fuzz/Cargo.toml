[package]
name = "tls-net-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tls-net = { path = ".." }

# Not part of a workspace.
[workspace]
members = ["."]

[[bin]]
name = "hello_parse"
path = "fuzz_targets/hello_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "der_fields"
path = "fuzz_targets/der_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pem_intake"
path = "fuzz_targets/pem_intake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_step_server"
path = "fuzz_targets/session_step_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_step_client"
path = "fuzz_targets/session_step_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ticket_open"
path = "fuzz_targets/ticket_open.rs"
test = false
doc = false
bench = false
