# =============================================================================
#  R E P S   ·   tls-net
# =============================================================================
[package]
name    = "tls-net"
version = "0.7.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "TLS for net-io: a thin adapter that plugs rustls into net-io's TLS seam, with certificate loading and hot reload, SNI, ALPN, client certificates, ClientHello capture, and a policy shaped by shield-sec."

# Keywords (5 max)
keywords = ["tls", "ssl", "rustls", "https", "network"]

# Categories
categories = ["network-programming", "cryptography"]

# Links
homepage      = "https://github.com/jamesgober/tls-net"
repository    = "https://github.com/jamesgober/tls-net"
documentation = "https://docs.rs/tls-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
# Every feature except `fips`, which needs CMake and Go (decision D-042).
features = ["aws-lc", "ring", "webpki-roots", "platform-verifier", "key-vault", "net-io", "ja3-md5", "rustls-escape-hatch", "dangerous-keylog"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "tls_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
# Each feature and its reason is in dev/PLAN.md (section 7) and docs/API.md.
[features]
default = ["aws-lc", "webpki-roots", "key-vault", "net-io"]

# Crypto provider (decision D-004). With both on, aws-lc-rs is used. With
# neither, every constructor returns `TlsError::NoProvider`.
aws-lc = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]
ring = ["rustls/ring"]
# FIPS 140-3 mode over aws-lc-rs: builds aws-lc-fips-sys, which needs CMake
# and Go (and on Windows NASM, Ninja, and clang). Kept out of the gate's
# feature list on Windows and macOS (decision D-042).
fips = ["aws-lc", "rustls/fips"]
# Windows x86-64 machines without NASM (pass-through to aws-lc-rs).
prebuilt-nasm = ["aws-lc", "dep:aws-lc-rs", "aws-lc-rs/prebuilt-nasm"]

# Client trust (decision D-005).
webpki-roots = ["dep:webpki-roots"]
platform-verifier = ["dep:rustls-platform-verifier"]

# Key and ticket-key custody in key-vault (decision D-021).
key-vault = ["dep:key-vault"]

# The net-io TLS seam (decision D-036).
net-io = ["dep:net-io"]

# JA3 MD5 digest, a fingerprint label only (decision D-016).
ja3-md5 = []

# Raw rustls configuration access; outside semver.
rustls-escape-hatch = []

# NSS key log output for debugging. Never in production (decision D-040).
dangerous-keylog = []


# DEPENDENCIES
# #################################
[dependencies]
# The TLS implementation: the one accepted third-party runtime dependency
# (decision D-001). Default features off: no `log`, no compression, no
# process-default provider.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }

# Only so `prebuilt-nasm` can reach aws-lc-rs; rustls already depends on it.
aws-lc-rs = { version = "1.19", optional = true, default-features = false }

# Mozilla root program bundle for clients (CDLA-Permissive-2.0 data).
webpki-roots = { version = "1.0.11", optional = true }

# Operating system trust store (non-default).
rustls-platform-verifier = { version = "0.7.1", optional = true }

# Ticket AEAD, the ticket ratchet, JA4 and SPKI hashing (decision D-012).
crypt-io = { version = "1.2.2", default-features = false, features = ["std", "zeroize", "aead-chacha20", "hash-sha2", "kdf-hkdf"] }

# Custody of private keys and ticket keys.
key-vault = { version = "1.1", optional = true, default-features = false, features = ["std", "mlock", "zeroize", "fragment-standard"] }

# The TLS seam traits (TlsAcceptor, TlsSession). The seam is identical in
# net-io 0.4.0 through 0.6 (decision D-036).
net-io = { version = ">=0.4, <0.7", optional = true, default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# The net-io server integration for the adapter's end-to-end tests.
net-io = { version = ">=0.4, <0.7", features = ["tls"] }
# Property tests.
proptest = { version = "1", default-features = false, features = ["std"] }
# Benchmarks (benches/, PLAN section 9); no rayon, no plots.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }


# Model checking of the snapshot, the capacity gate, and the ticket ring:
# `RUSTFLAGS="--cfg tls_net_loom" cargo test --release --lib loom`.
[target.'cfg(tls_net_loom)'.dependencies]
loom = "0.7"


# EXAMPLES
# #################################
[[example]]
name = "https_get"
required-features = ["webpki-roots"]


# BENCHMARKS
# #################################
# `cargo bench`; the SNI table bench needs `RUSTFLAGS="--cfg tls_net_bench"`.
# Method and results: docs/PERFORMANCE.md.
[[bench]]
name = "hello"
harness = false

[[bench]]
name = "session"
harness = false
required-features = ["rustls-escape-hatch", "key-vault"]

[[bench]]
name = "config"
harness = false
required-features = ["rustls-escape-hatch"]

[[bench]]
name = "paired"
harness = false
required-features = ["rustls-escape-hatch"]

[[bench]]
name = "memory"
harness = false
required-features = ["rustls-escape-hatch"]


# LINTS
# #################################
[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing` (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(tls_net_loom)", "cfg(tls_net_bench)"] }


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
